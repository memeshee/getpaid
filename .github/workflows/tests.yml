name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.0'
      # Ephemeral CI-only credentials for localhost test containers.
      # Must match the test services in getpaid_server/docker-compose.yaml.
      POSTGRES_TEST_PASSWORD: 'postgres'
      REDIS_TEST_PASSWORD: 'redis'
      SERVERPOD_PASSWORD_database: 'postgres'
      SERVERPOD_PASSWORD_redis: 'redis'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Start containers
        working-directory: getpaid_server
        run: docker compose up --quiet-pull --build -d

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart pub global activate serverpod_cli $VERSION
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Run Serverpod generator
        working-directory: getpaid_server
        run: serverpod generate

      - name: Run tests
        working-directory: getpaid_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: getpaid_server
        run: docker compose down -v
